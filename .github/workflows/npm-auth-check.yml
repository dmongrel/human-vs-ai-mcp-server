
# TEMPORARY diagnostic. Verifies that NPM_TOKEN authenticates against the
# registry at all. Deliberately contains no publish step, so running it cannot
# release anything. Delete once the publish workflow is known-good.
name: npm auth check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: token present?
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Never print the token. Length and prefix are enough to tell an empty
        # or malformed secret from a real one (npm tokens start with npm_).
        run: |
          echo "token length: ${#NODE_AUTH_TOKEN}"
          echo "token prefix: ${NODE_AUTH_TOKEN:0:4}"
      - name: whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami
      - name: can this token create a new package?
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # --dry-run still performs the auth handshake, so this reproduces the
        # publish failure without publishing.
        run: npm publish --dry-run --access public

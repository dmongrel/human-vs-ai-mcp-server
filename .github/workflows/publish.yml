name: Publish to npm

on:
  push:
    tags:
      - "v*"
  # Manual trigger, so a release interrupted partway (one package published,
  # the other not) can be finished without inventing a new version tag.
  workflow_dispatch:

permissions:
  contents: read

# Two jobs, in this order, because the root package pins
# human-vs-ai-mcp-server-win32-x64 at an exact version. Publishing the root
# first leaves a window where every install resolves a dependency that does not
# exist yet -- and since optionalDependencies fail open, that failure is silent:
# users get no perplexity signal and no error saying why.
jobs:
  platform-win32-x64:
    # Must be Windows. The helper is a Windows binary and build-win32-x64.ps1
    # is a PowerShell script; there is no cross-compile path today (see
    # native/llama-engine/PLATFORMS.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+, not 20: `npm test` runs `node --test "dist-test/**/*.test.js"`,
          # and glob expansion for --test only exists from Node 21. On 20 the
          # whole suite silently "finds no files" and fails.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - run: npm install
      # The binaries are gitignored build output, so a fresh checkout has none.
      # Without this step the package publishes with only package.json+README.
      - run: npm run build:native
      - run: npm run check:native
      # Skip if this version is already on the registry, so a rerun after a
      # later-job failure does not dead-end on "cannot publish over an existing
      # version" and strand the root package unpublished.
      - name: publish platform package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./packages/win32-x64/package.json').name")
          VERSION=$(node -p "require('./packages/win32-x64/package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published - skipping"
          else
            npm publish ./packages/win32-x64
          fi

  root:
    needs: platform-win32-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+, not 20: `npm test` runs `node --test "dist-test/**/*.test.js"`,
          # and glob expansion for --test only exists from Node 21. On 20 the
          # whole suite silently "finds no files" and fails.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: publish root package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published - skipping"
          else
            npm publish
          fi
      - run: node scripts/release-reminder.js
